syntax = 'proto3';
package tracdap.metadata;

option java_package = "org.finos.tracdap.metadata";
option java_multiple_files = true;

import "tracdap/metadata/type.proto";
import "tracdap/metadata/object_id.proto";
import "tracdap/metadata/tag_update.proto";
import "tracdap/metadata/data.proto";


/**
 * Specify the type of an individual TRAC job
 */
enum JobType {
  JOB_TYPE_NOT_SET = 0;

  /// Run a single model, with parameters and inputs
  RUN_MODEL = 1;

  /// Run a flow with all its models, parameters and inputs
  RUN_FLOW = 2;

  /// Import a model into the platform
  IMPORT_MODEL = 3;

  /// Import data into the platform
  IMPORT_DATA = 4;

  /// Export data to external locations
  EXPORT_DATA = 5;

  /// A job built from a collection of other jobs
  JOB_GROUP = 6;
}

/**
 * Indicate the status of a job in the TRAC platform
 */
enum JobStatusCode {

  JOB_STATUS_CODE_NOT_SET = 0;

  /// The job is being set up
  PREPARING = 1;

  /// The job has passed validation and is ok to run (dry-run operations may return this status)
  VALIDATED = 2;

  /// The job is being set up
  PENDING = 3;

  /// The job is queued in TRAC, waiting for available resources
  QUEUED = 4;

  /// The job has been submitted for execution but has not yet started
  SUBMITTED = 5;

  /// The job is currently running
  RUNNING = 6;

  /// Job execution completed, the platform is cleaning up and validating the outputs
  FINISHING = 7;

  /// The job completed successfully and the results are available
  SUCCEEDED = 8;

  /// The job failed and has been terminated or rejected
  FAILED = 9;

  /// The job was cancelled by a user of the platform
  CANCELLED = 10;
}

/**
 * Define a job to run on the TRAC platform
 */
message JobDefinition {

  JobType jobType = 1;

  oneof jobDetails {
    RunModelJob runModel = 2;
    RunFlowJob runFlow = 3;
    ImportModelJob importModel = 4;
    ImportDataJob importData = 5;
    ExportDataJob exportData = 6;
    JobGroup jobGroup = 7;
  }

  TagSelector resultId = 8;
}

/**
 * Define the result of a job after it has completed
 */
message ResultDefinition {

  TagSelector jobId = 1;

  JobStatusCode statusCode = 2;
  string statusMessage = 3;

  optional TagSelector logFileId = 4;

  map<string, TagSelector> outputs = 5;

  /// Files written to external storage, keyed by placement name
  map<string, PlacementRecord> placements = 6;
}

/**
 * A file a job placed in external storage
 */
message PlacementRecord {

  /// The DATA object placed, at the version used
  TagSelector dataId = 1;

  /// Where the file was written: storage key, the path actually written, protocol and location details
  ExternalLocation location = 2;

  /// Format code of the file written (e.g. CSV, PARQUET, ARROW_FILE)
  string format = 3;

  string mimeType = 4;

  /// Size of the file written, in bytes
  int64 size = 5;

  /// SHA-256 of the bytes written, in hex
  string contentHash = 6;
}

/**
 * Specification for a RuN_MODEL job
 */
message RunModelJob {

  TagSelector model = 1;

  map<string, Value> parameters = 2;
  map<string, TagSelector> inputs = 3;
  map<string, TagSelector> outputs = 4;
  map<string, TagSelector> priorOutputs = 5;
  map<string, string> resources = 7;

  repeated TagUpdate outputAttrs = 6;
}

/**
 * Specification for a RUN_FLOW job
 */
message RunFlowJob {

  TagSelector flow = 1;

  map<string, Value> parameters = 2;
  map<string, TagSelector> inputs = 3;
  map<string, TagSelector> outputs = 4;
  map<string, TagSelector> priorOutputs = 5;
  map<string, TagSelector> models = 6;
  map<string, string> resources = 8;

  repeated TagUpdate outputAttrs = 7;

  repeated string exportStorageAccess = 9;
}

/**
 * Specification for an IMPORT_MODEL job
 */
message ImportModelJob {

  string language = 1;
  string repository = 2;

  optional string packageGroup = 7;
  string package = 8;
  string version = 5;

  string entryPoint = 4;

  string path = 3;

  repeated TagUpdate modelAttrs = 6;

  optional TagSelector priorModel = 9;
}

/**
 * Specification for an IMPORT_DATA job
 *
 * An import job either runs an import model, or captures files with no model.
 * For a capture job, model is not set and captures holds one or more captures.
 */
message ImportDataJob {

  TagSelector model = 1;

  map<string, Value> parameters = 2;
  map<string, TagSelector> inputs = 3;
  map<string, TagSelector> outputs = 4;
  map<string, TagSelector> priorOutputs = 5;

  repeated string storageAccess = 6;
  map<string, TagSelector> imports = 7 [deprecated = true];

  repeated TagUpdate outputAttrs = 8;
  repeated TagUpdate importAttrs = 9 [deprecated = true];

  /// Files to capture, keyed by capture name
  map<string, CaptureSource> captures = 10;
}

/**
 * Capture a data file into TRAC as part of a job.
 *
 * The runtime reads the file once. From those bytes it can keep a FILE object (the bytes unchanged)
 * and a DATA object (decoded from the bytes).
 */
message CaptureSource {

  /// Where the file comes from
  oneof source {
    ExternalLocation location = 1;      // capture from an external storage location
  }

  /// Where the dataset's schema comes from
  CaptureSchemaSource schemaSource = 4;

  /// The declared schema, for CAPTURE_SCHEMA_DECLARED
  oneof schemaSpecifier {
    TagSelector schemaId = 5;           // a SCHEMA object
    SchemaDefinition schema = 6;        // inline; dev mode only, rejected by platform validation
  }

  /// Attributes for the captured DATA object
  repeated TagUpdate dataAttrs = 8;

  /// Attributes for the captured FILE object
  repeated TagUpdate fileAttrs = 9;
}

/**
 * A single file in an external storage location
 */
message ExternalLocation {

  /// External storage resource key (an EXTERNAL_STORAGE resource)
  string storageKey = 1;

  /// Path of a single file, relative to the resource root
  string storagePath = 2;

  /// Protocol of the storage resource when the job was submitted; set by the platform
  string protocol = 3;

  /// Location properties of the storage resource when the job was submitted (e.g. bucket, container, prefix,
  /// root path); set by the platform, never credentials
  map<string, string> locationDetails = 4;
}

/**
 * Where a captured dataset's schema comes from
 */
enum CaptureSchemaSource {
  CAPTURE_SCHEMA_SOURCE_NOT_SET = 0;    // the job type's default, where it has one
  CAPTURE_SCHEMA_DECLARED = 1;          // schemaId or schema
  CAPTURE_SCHEMA_FILE = 2;              // the file's own schema (Parquet, Arrow)
}

/**
 * Specification for an EXPORT_DATA job
 *
 * An export job places TRAC datasets in external storage, with no model. The model-based fields
 * are not used by export jobs and must be empty. Export models run as export nodes in a flow.
 */
message ExportDataJob {

  TagSelector model = 1;

  map<string, Value> parameters = 2;
  map<string, TagSelector> inputs = 3;
  map<string, TagSelector> outputs = 4;
  map<string, TagSelector> priorOutputs = 5;

  repeated string storageAccess = 6;
  map<string, TagSelector> exports = 7 [deprecated = true];

  repeated TagUpdate outputAttrs = 8;

  /// Datasets to place in external storage, keyed by placement name
  map<string, PlacementTarget> placements = 9;

  /// What every placement in the job does when a file already exists at its path
  PlacementConflict placementConflict = 10;
}

/**
 * Place a TRAC dataset into external storage as a data file, as part of a job.
 *
 * The runtime encodes the dataset with TRAC's format codecs and writes one file.
 * The job's RESULT records what was written.
 */
message PlacementTarget {

  /// What to place
  oneof source {
    TagSelector dataId = 1;             // an existing DATA object
  }

  /// Where to place it: a single file path, whose extension sets the format
  ExternalLocation location = 3;
}

/**
 * What a placement does when a file already exists at its path
 */
enum PlacementConflict {
  PLACEMENT_CONFLICT_NOT_SET = 0;       // same as PLACEMENT_SUFFIX
  PLACEMENT_SUFFIX = 1;                 // write name-2.ext, name-3.ext, ... (the first free name)
  PLACEMENT_OVERWRITE = 2;              // replace the existing file
  PLACEMENT_FAIL = 3;                   // fail the job, before any placement writes
}


/**
 * Specify the group type for a JOB_GROUP job
 */
enum JobGroupType {
  JOB_GROUP_TYPE_NOT_SET = 0;
  SEQUENTIAL_JOB_GROUP = 1;
  PARALLEL_JOB_GROUP = 2;
}

/**
 * Specification for a JOB_GROUP job, which runs a collection of other jobs
 */
message JobGroup {

  JobGroupType jobGroupType = 1;

  oneof jobGroupDetails {
    SequentialJobGroup sequential = 2;
    ParallelJobGroup parallel = 3;
  }
}

/**
 * A job group where each job runs in sequence
 */
message SequentialJobGroup {

  repeated JobDefinition jobs = 1;
}

/**
 * A job group where all jobs runs in parallel
 */
message ParallelJobGroup {

  repeated JobDefinition jobs = 1;
}


