syntax = "proto3";
package tracdap.api;

option java_package = "org.finos.tracdap.api";
option java_outer_classname = "OrchestratorServiceProto";
option java_multiple_files = true;

import "tracdap/metadata/object_id.proto";
import "tracdap/metadata/job.proto";
import "tracdap/metadata/tag_update.proto";

import "google/api/annotations.proto";


/**
 * Public API for submitting, querying and managing jobs in the TRAC platform
 */
service TracOrchestratorApi {

  /**
   * Check whether a job request is valid, without submitting it for execution.
   *
   * Validation covers similar checks to those applied when a job is submitted, so
   * a job that validates successfully can be expected to submit without a
   * validation error.
   */
  rpc validateJob (JobRequest) returns (JobStatus) {
    option (google.api.http) = {
      post: "/{tenant}/validate-job"
      body: "*"
    };
  }

  /**
   * Submit a job for execution on the TRAC platform.
   *
   * The response includes the ID of the newly created job, which can be used to
   * check on its progress with checkJob() or followJob().
   */
  rpc submitJob (JobRequest) returns (JobStatus) {
    option (google.api.http) = {
      post: "/{tenant}/submit-job"
      body: "*"
    };
  }

  /**
   * Get a snapshot of the current status of a job.
   *
   * The job is identified using a tag selector, typically the job ID returned by
   * submitJob(). This call returns a single status snapshot; use followJob() for
   * a stream of updates instead.
   */
  rpc checkJob (JobStatusRequest) returns (JobStatus) {
    option (google.api.http) = {
      post: "/{tenant}/check-job"
      body: "selector"
    };
  }

  /**
   * Follow the status of a job over time.
   *
   * The job is identified using a tag selector, as for checkJob(). This is a
   * server-streaming equivalent of checkJob(), for clients that want to track a
   * job's status without polling.
   */
  rpc followJob (JobStatusRequest) returns (stream JobStatus);

  /**
   * Request cancellation of a queued or running job.
   *
   * The job is identified using a tag selector, as for checkJob(). Use checkJob()
   * or followJob() to confirm the job's status after requesting cancellation.
   */
  rpc cancelJob (JobStatusRequest) returns (JobStatus);
}

/**
 * Request to submit (or validate) a new job
 */
message JobRequest {

  string tenant = 1;

  metadata.JobDefinition job = 2;

  repeated metadata.TagUpdate jobAttrs = 3;
}

/**
 * Request to check the status or results of an existing job
 */
message JobStatusRequest {

  string tenant = 1;

  metadata.TagSelector selector = 2;
}

/**
 * Provides the status of a new or existing job in the platform
 */
message JobStatus {

  metadata.TagHeader jobId = 1;

  metadata.JobStatusCode statusCode = 2;
  string statusMessage = 3;
}
