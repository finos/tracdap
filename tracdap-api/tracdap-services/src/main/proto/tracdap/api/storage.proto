syntax = "proto3";
package tracdap.api;

option java_package = "org.finos.tracdap.api";
option java_outer_classname = "StorageServiceProto";
option java_multiple_files = true;

import "tracdap/metadata/type.proto";


/**
 * Low-level API for reading and writing content directly in TRAC-managed storage.
 *
 * Unlike TracDataApi, this API works directly with files and directories in a
 * named storage location (identified by a storage key and path), without
 * creating or updating any metadata in the TRAC metadata store. It is intended
 * for use cases that need direct access to the underlying storage technology,
 * rather than TRAC's managed data and file objects.
 */
service TracStorageApi {

  /**
   * Check whether a file or directory exists at the given storage path.
   */
  rpc exists(StorageRequest) returns (StorageExistsResponse);

  /**
   * Get the size in bytes of a file at the given storage path.
   */
  rpc size(StorageRequest) returns (StorageSizeResponse);

  /**
   * Get metadata (FileStat) for a file or directory at the given storage path.
   */
  rpc stat(StorageRequest) returns (StorageStatResponse);

  /**
   * List the contents of a directory at the given storage path.
   */
  rpc ls(StorageRequest) returns (StorageLsResponse);

  /**
   * Create a directory at the given storage path.
   */
  rpc mkdir(StorageRequest) returns (StorageOkResponse);

  /**
   * Remove a file at the given storage path.
   */
  rpc rm(StorageRequest) returns (StorageOkResponse);

  /**
   * Remove a directory at the given storage path.
   */
  rpc rmdir(StorageRequest) returns (StorageOkResponse);

  /**
   * Read a file as a stream of content chunks.
   *
   * This is a server-streaming method, intended for files that may be too large
   * to return in a single message. Use readSmallFile() for a simpler, unary
   * alternative.
   */
  rpc readFile(StorageReadRequest) returns (stream StorageReadResponse);

  /**
   * Read a file and return its content in a single message.
   *
   * This is a unary method; errors may occur if the file is too large to fit in
   * a single message frame. Use readFile() to stream larger files instead.
   */
  rpc readSmallFile(StorageReadRequest) returns (StorageReadResponse);

  /**
   * Write a file from a stream of content chunks.
   *
   * This is a client-streaming method, intended for files that may be too large
   * to send in a single message. Use writeSmallFile() for a simpler, unary
   * alternative.
   */
  rpc writeFile(stream StorageWriteRequest) returns (StorageOkResponse);

  /**
   * Write a file in a single message.
   *
   * This is a unary method; errors may occur if the content is too large to fit
   * in a single message frame. Use writeFile() to stream larger content instead.
   */
  rpc writeSmallFile(StorageWriteRequest) returns (StorageOkResponse);
}

/**
 * Identifies a file or directory in TRAC storage, for calls that do not send or
 * receive file content (exists(), size(), stat(), ls(), mkdir(), rm(), rmdir()).
 */
message StorageRequest {

  string tenant = 1;
  string storageKey = 2;
  string storagePath = 3;
}

/**
 * Identifies a file to read from TRAC storage, for readFile() and readSmallFile().
 */
message StorageReadRequest {

  string tenant = 1;
  string storageKey = 2;
  string storagePath = 3;
}

/**
 * Identifies a file to write in TRAC storage, together with its content.
 *
 * Used as a single message for writeSmallFile(), or as a stream of messages
 * (each carrying one chunk of content) for writeFile().
 */
message StorageWriteRequest {

  string tenant = 1;
  string storageKey = 2;
  string storagePath = 3;

  bytes content = 4;
}

/**
 * Result of an exists() call, indicating whether the given path was found.
 */
message StorageExistsResponse {

  bool exists = 1;
}

/**
 * Result of a size() call, giving the size of a file in bytes.
 */
message StorageSizeResponse {

  int64 size = 1;
}

/**
 * Result of a stat() call, giving metadata for a file or directory.
 */
message StorageStatResponse {

  FileStat stat = 1;
}

/**
 * Result of an ls() call, listing the metadata for each entry in a directory.
 */
message StorageLsResponse {

  repeated FileStat stat = 1;
}

/**
 * The content of a file read from TRAC storage, together with its metadata.
 *
 * Used as a single message for readSmallFile(), or as a stream of messages
 * (each carrying one chunk of content) for readFile().
 */
message StorageReadResponse {

  FileStat stat = 1;
  bytes content = 2;
}

/**
 * Result of a storage operation that does not return file content, such as
 * mkdir(), rm() or rmdir().
 */
message StorageOkResponse {

  FileStat stat = 1;
}

/**
 * Metadata for a file or directory in TRAC storage.
 */
message FileStat {

  string storagePath = 1;
  string fileName = 2;
  FileType fileType = 3;
  int64 fileSize = 4;

  metadata.DatetimeValue mtime = 5;
  optional metadata.DatetimeValue atime = 6;
}

/**
 * Distinguishes files from directories in FileStat.
 */
enum FileType {
  FILE_TYPE_NOT_SET = 0;
  FILE = 1;
  DIRECTORY = 2;
}
