  outputs:
    region_totals: { objectType: DATA, label: Totals for the flow, fields: [region, total] }
    annotated_report: { objectType: FILE, label: Annotated notes for the flow, fileType: txt, props: { audience: internal } }

outputs:
  region_totals: DATA
  annotated_report: FILE
