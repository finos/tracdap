description: A DATA branch and a FILE branch with every input and output declared by object type only, run twice

outcome: SUCCEEDED

flow:
  inputs:
    accounts: { objectType: DATA, label: Accounts for the flow, fields: [id, region, amount], props: { source_system: ledger } }
