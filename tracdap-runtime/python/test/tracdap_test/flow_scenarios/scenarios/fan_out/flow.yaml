nodes:

  accounts:
    nodeType: INPUT_NODE

  filter:
    nodeType: MODEL_NODE
    inputs: [accounts]
    outputs: [filtered_accounts]

  sum_all:
    nodeType: MODEL_NODE
    inputs: [accounts]
    outputs: [region_totals]

  sum_filtered:
    nodeType: MODEL_NODE
    inputs: [accounts]
    outputs: [region_totals]

  count_filtered:
    nodeType: MODEL_NODE
    inputs: [accounts]
    outputs: [account_count]

  totals_all:
    nodeType: OUTPUT_NODE

  totals_filtered:
    nodeType: OUTPUT_NODE

  account_count:
    nodeType: OUTPUT_NODE

edges:

  - source: { node: accounts }
    target: { node: filter, socket: accounts }

  - source: { node: accounts }
    target: { node: sum_all, socket: accounts }

  - source: { node: filter, socket: filtered_accounts }
    target: { node: sum_filtered, socket: accounts }

  - source: { node: filter, socket: filtered_accounts }
    target: { node: count_filtered, socket: accounts }

  - source: { node: sum_all, socket: region_totals }
    target: { node: totals_all }

  - source: { node: sum_filtered, socket: region_totals }
    target: { node: totals_filtered }

  - source: { node: count_filtered, socket: account_count }
    target: { node: account_count }
