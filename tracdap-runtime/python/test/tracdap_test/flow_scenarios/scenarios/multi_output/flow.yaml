nodes:

  accounts:
    nodeType: INPUT_NODE

  split:
    nodeType: MODEL_NODE
    inputs: [accounts]
    outputs: [high_value, low_value, rejects]

  aggregate:
    nodeType: MODEL_NODE
    inputs: [accounts]
    outputs: [region_totals]

  high_value:
    nodeType: OUTPUT_NODE

  rejects:
    nodeType: OUTPUT_NODE

  region_totals:
    nodeType: OUTPUT_NODE

edges:

  - source: { node: accounts }
    target: { node: split, socket: accounts }

  - source: { node: split, socket: high_value }
    target: { node: high_value }

  - source: { node: split, socket: rejects }
    target: { node: rejects }

  - source: { node: split, socket: low_value }
    target: { node: aggregate, socket: accounts }

  - source: { node: aggregate, socket: region_totals }
    target: { node: region_totals }
