nodes:

  accounts:
    nodeType: INPUT_NODE

  filter:
    nodeType: MODEL_NODE
    inputs: [accounts]
    outputs: [filtered_accounts]

  aggregate:
    nodeType: MODEL_NODE
    inputs: [accounts]
    outputs: [region_totals]

  region_totals:
    nodeType: OUTPUT_NODE

edges:

  - source: { node: accounts }
    target: { node: filter, socket: accounts }

  - source: { node: filter, socket: filtered_accounts }
    target: { node: aggregate, socket: accounts }

  - source: { node: aggregate, socket: region_totals }
    target: { node: region_totals }

parameters:

  min_amount:
    paramType: { basicType: FLOAT }
    label: Minimum amount for the flow
    defaultValue: { type: { basicType: FLOAT }, floatValue: 25.0 }

inputs:

  accounts:
    objectType: DATA
    label: Accounts for the flow
    schema:
      schemaType: TABLE_SCHEMA
      partType: PART_ROOT
      table:
        fields:
          - { fieldName: id, fieldType: STRING, label: Account ID, businessKey: true, notNull: true }
          - { fieldName: region, fieldOrder: 1, fieldType: STRING, label: Region, categorical: true }
          - { fieldName: amount, fieldOrder: 2, fieldType: FLOAT, label: Amount }

outputs:

  region_totals:
    objectType: DATA
    label: Totals for the flow
    schema:
      schemaType: TABLE_SCHEMA
      partType: PART_ROOT
      table:
        fields:
          - { fieldName: region, fieldType: STRING, label: Region, businessKey: true, categorical: true, notNull: true }
          - { fieldName: total, fieldOrder: 1, fieldType: FLOAT, label: Total amount }
